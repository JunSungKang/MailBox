name: mailbox

services:
  mailbox-smtp-receiver:
    image: mailbox-smtp-receiver:dev
    build:
      context: ./smtp-receiver
    container_name: mailbox-smtp-receiver
    restart: unless-stopped
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.ds-mail.p-e.kr}
      MAIL_DOMAINS: ${MAIL_DOMAINS:-ds-mail.p-e.kr post.ds-mail.p-e.kr crmnova-fin.kro.kr post.crmnova-fin.kro.kr}
      MYNETWORKS: ${MYNETWORKS:-127.0.0.0/8 172.25.0.0/16}
    ports:
      - "${SMTP_PORT:-25}:25"
    volumes:
      - mailbox-store:/var/mail/vhosts
      - smtp-queue-store:/var/spool/postfix
      - mailbox-account-store:/accounts
      - type: bind
        source: ${MAIL_TLS_DIR:-./tls}
        target: /etc/mailbox/tls
        read_only: true
        bind:
          create_host_path: false

  mailbox-imap-mailbox:
    image: mailbox-imap-mailbox:dev
    build:
      context: ./imap-mailbox
    container_name: mailbox-imap-mailbox
    restart: unless-stopped
    depends_on:
      - mailbox-smtp-receiver
    ports:
      - "${IMAP_PORT:-143}:143"
    volumes:
      - mailbox-store:/var/mail/vhosts
      - mailbox-account-store:/accounts
      - type: bind
        source: ${MAIL_TLS_DIR:-./tls}
        target: /etc/mailbox/tls
        read_only: true
        bind:
          create_host_path: false

  mailbox-webmail-ui:
    image: mailbox-webmail-ui:dev
    build:
      context: ./webmail-ui
    container_name: mailbox-webmail-ui
    restart: unless-stopped
    depends_on:
      - mailbox-smtp-receiver
      - mailbox-imap-mailbox
    environment:
      PORT: 3000
      MAIL_DATA_DIR: /app/data
      MAILDIR_IMPORT_DIR: /mailboxes/mailbox/Maildir
      MAILDIR_IMPORT_PARENT_DIR: /mailboxes
      MAIL_ACCOUNT_DIR: /accounts
      MAIL_DOMAINS: ${MAIL_DOMAINS:-ds-mail.p-e.kr post.ds-mail.p-e.kr crmnova-fin.kro.kr post.crmnova-fin.kro.kr}
      SMTP_URL: smtp://mailbox-smtp-receiver:25/?ignoreTLS=true
      MAIL_FROM: ${MAIL_FROM:-mailbox@ds-mail.p-e.kr}
      MAIL_DEFAULT_DOMAIN: ${MAIL_DEFAULT_DOMAIN:-ds-mail.p-e.kr}
      WEBMAIL_SESSION_SECRET: ${WEBMAIL_SESSION_SECRET:-local-development-only}
      WEBMAIL_SIGNUP_TOKEN: ${WEBMAIL_SIGNUP_TOKEN:-local-signup-token}
      WEBMAIL_COOKIE_SECURE: ${WEBMAIL_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${MAIL_WEB_PORT:-18080}:3000"
    volumes:
      - webmail-data-store:/app/data
      - mailbox-store:/mailboxes:ro
      - mailbox-account-store:/accounts

networks:
  default:
    ipam:
      config:
        - subnet: ${MAIL_NETWORK_SUBNET:-172.25.0.0/16}

volumes:
  mailbox-store:
    name: mailbox-store
  smtp-queue-store:
    name: smtp-queue-store
  webmail-data-store:
    name: webmail-data-store
  mailbox-account-store:
    name: mailbox-account-store
