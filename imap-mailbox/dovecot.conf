protocols = imap
listen = *
disable_plaintext_auth = yes
ssl = required
ssl_cert = </etc/mailbox/tls/fullchain.pem
ssl_key = </etc/mailbox/tls/privkey.pem
ssl_min_protocol = TLSv1.2
auth_mechanisms = plain login
mail_privileged_group = vmail
mail_uid = vmail
mail_gid = vmail
mail_location = maildir:/var/mail/vhosts/%n/Maildir

passdb {
  driver = passwd-file
  args = username_format=%n /accounts/dovecot-users
}

userdb {
  driver = passwd-file
  args = username_format=%n /accounts/dovecot-users
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

service auth {
  extra_groups = vmail
  unix_listener /run/smtp-auth/auth {
    mode = 0660
    user = root
    group = smtp-auth
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
    group = vmail
  }
}

log_path = /dev/stderr
info_log_path = /dev/stdout
