dovecot_config_version = 2.4.0
# Keep indexes readable by the previous 2.3 instance during rollback.
dovecot_storage_version = 2.3.0

protocols = imap
listen = *
auth_allow_cleartext = no
ssl = required
ssl_server_cert_file = /etc/mailbox/tls/fullchain.pem
ssl_server_key_file = /etc/mailbox/tls/privkey.pem
ssl_min_protocol = TLSv1.2
auth_mechanisms = plain login
mail_privileged_group = vmail
mail_uid = vmail
mail_gid = vmail
mail_driver = maildir
mail_path = /var/mail/vhosts/%{user | username}/Maildir

passdb passwd-file {
  auth_username_format = %{user | username}
  passwd_file_path = /accounts/dovecot-users
}

userdb passwd-file {
  auth_username_format = %{user | username}
  passwd_file_path = /accounts/dovecot-users
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

service auth {
  extra_groups = vmail
  unix_listener /run/smtp-auth/auth {
    mode = 0660
    user = root
    group = smtp-auth
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
    group = vmail
  }
}

log_path = /dev/stderr
info_log_path = /dev/stdout
